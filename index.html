<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<!-- 용광로 마크: 로고, 간판, 조직도에서 <use href="#furnace"> 로 불러 씁니다 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="furnace" viewBox="0 0 100 100">
    <rect x="40" y="2" width="20" height="8"/>
    <path fill-rule="evenodd" d="M27 10H73V20H70L80 56V90H20V56L30 20H27ZM29 31H71V36H29ZM25 45H75V50H25ZM36 90V73C36 65 42 59 50 59S64 65 64 73V90Z"/>
    <path class="flame" d="M50 89C42 89 38 83 40.5 76.5 42.3 72.5 45.5 70.5 45.5 65.5 49.5 68 51.5 72 51 75.5 53.5 74 55 71 54.5 67.5 59.5 71.5 61.5 77.5 59.5 82.5 57.8 86.5 54.3 89 50 89Z"/>
    <rect x="8" y="90" width="84" height="7"/>
  </symbol>
</svg>

<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="masthead">
  <!-- 맨 위 붉은 띠: 부서 바로가기 -->
  <div class="util">
    <div class="container util__in">
      <p class="util__motto">교사는 태어나지 않는다. 만들어진다.</p>
      <a class="util__link" href="#org">조직도</a>
    </div>
  </div>

  <!-- 로고, 메뉴 찾기, 구인구직 -->
  <div class="container top">
    <a class="brand" href="#/" aria-label="교사개조 용광로 홈">
      <span class="tile brand__tile" aria-hidden="true"><svg class="mark" focusable="false"><use href="#furnace"/></svg></span>
      <span class="brand__name">교사개조 용광로</span>
    </a>
    <div class="top__find" data-find></div>
    <button class="btn btn--quiet menu-btn" id="menu-btn" type="button" aria-haspopup="dialog" aria-controls="sheet">전체메뉴</button>
  </div>

  <!-- 부서 일곱 칸과 펼침 메뉴 -->
  <div class="navrow">
    <div class="container navrow__in">
      <nav class="gnb" id="gnb" aria-label="부서 메뉴">
        <ul class="gnb__list" id="gnb-list"></ul>
        <div class="gnb__bg" id="gnb-bg" aria-hidden="true"></div>
      </nav>
      <button class="allmenu" id="all-btn" type="button" aria-haspopup="dialog" aria-controls="sheet">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span class="visually-hidden">전체메뉴</span>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <div class="visual" id="hero">
    <div class="container hero__in">
      <section class="hero__stage" aria-labelledby="hero-h">
        <h1 class="sign" id="hero-h" tabindex="-1">
          <span class="visually-hidden">교사개조 용광로</span>
          <span class="sign__row" aria-hidden="true">
            <span class="tile" style="--i:0">교</span>
            <span class="tile" style="--i:1">사</span>
            <span class="tile" style="--i:2">개</span>
            <span class="tile" style="--i:3">조</span>
          </span>
          <span class="sign__row" aria-hidden="true">
            <span class="tile" style="--i:4">용</span>
            <span class="tile" style="--i:5">광</span>
            <span class="tile" style="--i:6">로</span>
            <span class="tile" style="--i:7"><svg class="mark" focusable="false"><use href="#furnace"/></svg></span>
          </span>
        </h1>
        <div class="hero__foot">
          <p class="hero__lede">임용 준비부터 첫 발령까지 필요한 도구를 학교 부서처럼 나눠 모았습니다.</p>
          <div class="hero__actions">
            <a class="btn" href="#org">조직도 보기</a>
            <a class="hero__link" href="#/imyong/cost">1년 공부비용 계산</a>
          </div>
        </div>
      </section>
      <aside class="apps" aria-labelledby="apps-h">
        <h2 class="apps__title" id="apps-h">부서 웹앱 바로가기</h2>
        <ul class="apps__list" id="apps-list"></ul>
      </aside>
    </div>
  </div>

  <!-- 자주 찾는 메뉴, 조직도, 각 페이지는 app.js 가 이 아래에 그립니다 -->
</main>

<noscript>
  <p class="notice container">부서 메뉴는 자바스크립트를 켜야 보입니다.</p>
</noscript>

<footer class="foot">
  <div class="container">
    <nav aria-label="부서 바로가기">
      <ul class="foot__depts" id="foot-depts"></ul>
    </nav>
    <div class="foot__brand">
      <span class="tile foot__tile" aria-hidden="true"><svg class="mark" focusable="false"><use href="#furnace"/></svg></span>
      <div>
        <p class="foot__name">교사개조 용광로</p>
        <p class="foot__line">임용 준비부터 첫 발령까지, 학교 부서별로 모은 교사 도구.</p>
      </div>
    </div>
  </div>
</footer>

<dialog class="sheet" id="sheet" aria-label="전체메뉴">
  <div class="sheet__head">
    <span class="brand">
      <span class="tile brand__tile" aria-hidden="true"><svg class="mark" focusable="false"><use href="#furnace"/></svg></span>
      <span class="brand__name">전체메뉴</span>
    </span>
    <button class="btn btn--quiet" id="sheet-close" type="button">닫기</button>
  </div>
  <div class="sheet__body">
    <div class="sheet__find" data-find></div>
    <nav aria-label="부서 메뉴">
      <ul class="sheet__list" id="sheet-list"></ul>
    </nav>
  </div>
</dialog>
